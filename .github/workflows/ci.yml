name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bison flex git python3 python3-pip \
            libboost-dev libreadline-dev texinfo zlib1g-dev \
            ninja-build pkg-config cmake \
            libglib2.0-dev libpixman-1-dev \
            libhidapi-dev picocom

      - name: Host codec golden vector test
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Iapps/vehicle \
            apps/vehicle/v2_codec.c apps/vehicle/v2_selftest.c \
            apps/vehicle/tests/v2_codec_host_test.c -o /tmp/v2_codec_test
          /tmp/v2_codec_test

      - name: Apply toolchain patches
        run: tools/apply_toolchain_patches.sh

      - name: Cache SDCC
        uses: actions/cache@v4
        with:
          path: .toolchain
          key: sdcc-${{ hashFiles('tools/patches/**') }}-${{ hashFiles('.gitmodules') }}

      - name: Build SDCC-C251
        run: |
          if [ ! -x .toolchain/sdcc/bin/sdcc ]; then
            cd third_party/sdcc-c251
            mkdir -p build
            cd build
            CFLAGS=-std=gnu17 ../configure --enable-mcs251-port \
              --disable-z80-port --disable-z180-port --disable-r2k-port --disable-r2ka-port \
              --disable-r3ka-port --disable-r4k-port --disable-r5k-port --disable-r6k-port \
              --disable-sm83-port --disable-tlcs90-port --disable-ez80-port --disable-z80n-port \
              --disable-r800-port --disable-ds390-port --disable-ds400-port --disable-pic14-port \
              --disable-pic16-port --disable-hc08-port --disable-s08-port --disable-stm8-port \
              --disable-pdk13-port --disable-pdk14-port --disable-pdk15-port --disable-mos6502-port \
              --disable-mos65c02-port --disable-f8-port --disable-f8l-port --disable-non-free \
              --disable-sdcdb --prefix="$GITHUB_WORKSPACE/.toolchain/sdcc"
            make -j"$(nproc)"
            make install
          fi

      - name: Cache QEMU
        uses: actions/cache@v4
        with:
          path: third_party/qemu/build
          key: qemu-03c2e3017e25c3d1b18ada6a20e69925a89c7741

      - name: Build QEMU
        run: |
          if [ ! -x third_party/qemu/build/qemu-system-mcs251 ]; then
            mkdir -p third_party/qemu
            cd third_party/qemu
            git init -q
            git remote add origin https://github.com/processmission/qemu.git 2>/dev/null || true
            git fetch --depth 1 origin 03c2e3017e25c3d1b18ada6a20e69925a89c7741
            git checkout -q FETCH_HEAD
            mkdir -p build
            cd build
            ../configure --target-list=mcs251-softmmu --disable-docs \
              --enable-plugins --disable-werror
            ninja qemu-system-mcs251
          fi

      - name: Build USB HID ISP app
        run: python3 tools/build.py --app usb_hid_isp

      - name: Build vehicle firmware (V2 protocol)
        run: |
          python3 tools/build.py --app vehicle
          python3 tools/build.py --app vehicle_debug

      - name: Build and run QEMU
        run: python3 tools/build.py --app freertos_blinky --qemu --qemu-timeout 20

      - name: Build and run V2 golden self-test under QEMU
        run: python3 tools/build.py --app vehicle_v2test --qemu --qemu-timeout 20

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: freertos-blinky
          path: |
            build/freertos_blinky/freertos_blinky.map
            build/freertos_blinky/*.asm
